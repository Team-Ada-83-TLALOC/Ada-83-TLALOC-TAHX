PDK: ihp-sg13cmos5l

DESIGN_NAME: ino_decode_predict

IO_PIN_ORDER_CFG: dir::pin_order.cfg

VERILOG_FILES:
  - dir::src/ino_decode_predict.v

CLOCK_PORT: clk_i
CLOCK_PERIOD: 25

# Run de calibration (etude de vitesse, 24 octobre) : budgets d'entree / sortie tires
# du coeur entier par synth_InO/sta/sdc_macro.tcl, au lieu du SDC par defaut.
PNR_SDC_FILE: dir::ino_decode_predict_25ns.sdc
SIGNOFF_SDC_FILE: dir::ino_decode_predict_25ns.sdc
SYNTH_STRATEGY: "DELAY 1"
PL_TIMING_DRIVEN: true
GRT_ALLOW_CONGESTION: true

FP_SIZING: absolute
DIE_AREA: [0, 0, 800, 1050]
PL_TARGET_DENSITY_PCT: 60

RUN_LVS: false               # extraction SPICE (Magic) et LVS (Netgen)

meta:
  version: 2
  flow: Classic
  substituting_steps:
    Odb.CheckDesignAntennaProperties: null   # retire l'étape (pas de LEF sans Magic)
    Magic.SpiceExtraction: null
    Checker.IllegalOverlap: null
    Netgen.LVS: null
    Checker.LVS: null



RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true

RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_WRITE_LEF: false
RUN_MAGIC_DRC: false

RUN_KLAYOUT_STREAMOUT: true
RUN_KLAYOUT_XOR: false
RUN_KLAYOUT_DRC: false
