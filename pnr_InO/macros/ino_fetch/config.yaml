PDK: ihp-sg13cmos5l

DESIGN_NAME: ino_fetch

IO_PIN_ORDER_CFG: dir::pin_order.cfg

CTS_CLK_MAX_WIRE_LENGTH: 300        # µm : coupe les fils d'horloge longs par des tampons
CTS_DISTANCE_BETWEEN_BUFFERS: 300   # µm : tampons le long des grandes branches de l'arbre

VERILOG_FILES:
  - dir::src/ino_fetch.v

CLOCK_PORT: clk_i
CLOCK_PERIOD: 100

# Boite fixee : deux colonnes de SRAM (685 x 220 um), six rangees de pas 280 um
# a partir de y = 420 ; la logique va dans la bande du bas et le couloir central.
DIE_AREA: [0, 0, 1800, 2050]
FP_SIZING: absolute
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10

PL_TARGET_DENSITY_PCT: 58
PL_ROUTABILITY_DRIVEN: true
PL_RESIZER_HOLD_SLACK_MARGIN: 0.4

GRT_ALLOW_CONGESTION: true
GRT_ANTENNA_REPAIR_ITERS: 6
GRT_ANTENNA_REPAIR_MARGIN: 20
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.4
DIODE_ON_PORTS: in
DIODE_CELL: sg13cmos5l_antennanp/A

# SRAM IHP (bibliotheque sg13cmos5l_sram = lien vers sg13g2_sram).
MACROS:
  RM_IHPSG13_2P_512x32_c2_bm_bist:
    gds:
      - pdk_dir::libs.ref/sg13cmos5l_sram/gds/RM_IHPSG13_2P_512x32_c2_bm_bist.gds
    lef:
      - pdk_dir::libs.ref/sg13cmos5l_sram/lef/RM_IHPSG13_2P_512x32_c2_bm_bist.lef
    vh:
      - dir::src/RM_IHPSG13_2P_512x32_c2_bm_bist_blackbox.v
    lib:
      "*_typ_*":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_2P_512x32_c2_bm_bist_typ_1p20V_25C.lib
      "*_slow_*":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_2P_512x32_c2_bm_bist_slow_1p08V_125C.lib
      "*_fast_*":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_2P_512x32_c2_bm_bist_fast_1p32V_m55C.lib
    # Coller ici la sortie de : python3 placer_sram.py <netlist synthetise>
    instances:
      "u_fetch.gen_banks:1.u_ram.u_w0":
        location: [50, 249.80]
        orientation: FS
      "u_fetch.gen_banks:1.u_ram.u_w1":
        location: [900, 249.80]
        orientation: FS
      "u_fetch.gen_banks:2.u_ram.u_w0":
        location: [50, 599.87]
        orientation: N
      "u_fetch.gen_banks:2.u_ram.u_w1":
        location: [900, 599.87]
        orientation: N
      "u_fetch.gen_banks:3.u_ram.u_w0":
        location: [50, 849.80]
        orientation: FS
      "u_fetch.gen_banks:3.u_ram.u_w1":
        location: [900, 849.80]
        orientation: FS
      "u_fetch.gen_banks:4.u_ram.u_w0":
        location: [50, 1199.87]
        orientation: N
      "u_fetch.gen_banks:4.u_ram.u_w1":
        location: [900, 1199.87]
        orientation: N
      "u_fetch.u_tag_nx.u_r0":
        location: [50, 1449.80]
        orientation: FS
      "u_fetch.u_tag_nx.u_r1":
        location: [900, 1449.80]
        orientation: FS
      "u_fetch.u_tag.u_w0":
        location: [50, 1799.87]
        orientation: N

# Alimentation des SRAM : VDD! et VDDARRAY! sur VPWR, VSS! sur VGND (broches
# Metal4 de la macro).
PDN_MACRO_CONNECTIONS:
  - "u_fetch.* VPWR VGND VDD! VSS!"
  - "u_fetch.* VPWR VGND VDDARRAY! VSS!"

# Parasites estimes (26 octobre) : la configuration LibreLane de sg13cmos5l laisse
# LAYERS_RC vide ; l'estimation (repair_design, reparations apres routage global,
# timing des etapes de placement-routage) prend alors les valeurs du LEF technologique,
# environ 0,09 fF/um et 0,5 ohm/um en Metal2, quand l'extraction finale (OpenRCX,
# IHP_rcx_patterns.rules) en donne environ le double en capacite. Les reparations
# voient des fils deux fois trop legers : en signoff, des portes de force 1 chargent
# 0,28 pF (slews de 4 a 5 ns ; run E : 244 violations de slew, 4 vues par la
# reparation). Valeurs de la configuration de sg13g2 (ajustement d'OpenROAD-flow-
# scripts), meme pile de metaux de Metal1 a Metal4 ; TopMetal1 et vias : LEF.
LAYERS_RC:
  "*":
    Metal1: { res: 8.54576E-03, cap: 1.0E-10 }
    Metal2: { res: 2.53519E-03, cap: 1.69121E-04 }
    Metal3: { res: 1.54329E-03, cap: 1.82832E-04 }
    Metal4: { res: 6.31424E-04, cap: 1.66454E-04 }

RUN_LVS: false
RUN_KLAYOUT_DRC: false

meta:
  version: 2
  flow: Classic
  substituting_steps:
    Odb.CheckDesignAntennaProperties: null
    Magic.SpiceExtraction: null
    Checker.IllegalOverlap: null
    Netgen.LVS: null
    Checker.LVS: null

RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true

RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_WRITE_LEF: false
RUN_MAGIC_DRC: false

RUN_KLAYOUT_STREAMOUT: true
RUN_KLAYOUT_XOR: false
