PDK: ihp-sg13cmos5l

DESIGN_NAME: ino_data_cache

IO_PIN_ORDER_CFG: dir::pin_order.cfg

VERILOG_FILES:
  - dir::src/ino_data_cache.v

CLOCK_PORT: clk_i
CLOCK_PERIOD: 100

# Plan 2 (voir placer_sram.py) : une bande de logique horizontale de 620 um au
# milieu (y 355 .. 976 ; 420 um donnaient 44 000 de debordement au routage global) ; en dessous (FS) donnees voies 0, 1 et tags 0-1, au-dessus
# (N) donnees voies 2, 3 et tags 2-3, toutes broches vers la bande. Broches de la
# macro aux deux bouts de la bande (W : D_* ; E : EXEC_*, STACK_*, horloge, reset).
# Colonne libre de ~55 um a droite des tags du bas, du bas du die a la bande : elle
# garde des rangs de cellules sous les SRAM du bas (sinon le premier rang est a
# y = 147 et le controle de padding de DPL echoue sur les SRAM placees dessous).
FP_SIZING: absolute
DIE_AREA: [0, 0, 2275, 1334]
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10

PL_TARGET_DENSITY_PCT: 45
PL_ROUTABILITY_DRIVEN: true
GRT_ALLOW_CONGESTION: true

# Arbre d'horloge avec macros (lecon d'ino_fetch) et marges de hold.
CTS_CLK_MAX_WIRE_LENGTH: 300
CTS_DISTANCE_BETWEEN_BUFFERS: 300
PL_RESIZER_HOLD_SLACK_MARGIN: 0.4
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.4

# Buffers de fil poses au-dessus d'une SRAM : les ramener jusqu'a la bande.
PL_MAX_DISPLACEMENT_Y: 400

# Fils longs (slews) et antennes.
DESIGN_REPAIR_MAX_WIRE_LENGTH: 800
GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH: 800
GRT_ANTENNA_REPAIR_ITERS: 6
GRT_ANTENNA_REPAIR_MARGIN: 20
DIODE_ON_PORTS: in
DIODE_CELL: sg13cmos5l_antennanp/A

# SRAM IHP (bibliotheque sg13cmos5l_sram = lien vers sg13g2_sram).
MACROS:
  RM_IHPSG13_1P_1024x64_c2_bm_bist:
    gds:
      - pdk_dir::libs.ref/sg13cmos5l_sram/gds/RM_IHPSG13_1P_1024x64_c2_bm_bist.gds
    lef:
      - pdk_dir::libs.ref/sg13cmos5l_sram/lef/RM_IHPSG13_1P_1024x64_c2_bm_bist.lef
    vh:
      - dir::src/RM_IHPSG13_1P_1024x64_c2_bm_bist_blackbox.v
    lib:
      "*_typ_*":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_1024x64_c2_bm_bist_typ_1p20V_25C.lib
      "*_slow_*":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_1024x64_c2_bm_bist_slow_1p08V_125C.lib
      "*_fast_*":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_1024x64_c2_bm_bist_fast_1p32V_m55C.lib
    # Sortie de placer_sram.py (y cales sur la grille des pistes).
    instances:
      "u_core.gen_data:1.u_data.u_sram":
        location: [10, 18.39]
        orientation: FS
      "u_core.gen_data:2.u_data.u_sram":
        location: [810, 18.39]
        orientation: FS
      "u_core.gen_data:3.u_data.u_sram":
        location: [10, 975.71]
        orientation: N
      "u_core.gen_data:4.u_data.u_sram":
        location: [810, 975.71]
        orientation: N
  RM_IHPSG13_1P_256x48_c2_bm_bist:
    gds:
      - pdk_dir::libs.ref/sg13cmos5l_sram/gds/RM_IHPSG13_1P_256x48_c2_bm_bist.gds
    lef:
      - pdk_dir::libs.ref/sg13cmos5l_sram/lef/RM_IHPSG13_1P_256x48_c2_bm_bist.lef
    vh:
      - dir::src/RM_IHPSG13_1P_256x48_c2_bm_bist_blackbox.v
    lib:
      "*_typ_*":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_256x48_c2_bm_bist_typ_1p20V_25C.lib
      "*_slow_*":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_256x48_c2_bm_bist_slow_1p08V_125C.lib
      "*_fast_*":
        - pdk_dir::libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_256x48_c2_bm_bist_fast_1p32V_m55C.lib
    instances:
      "u_core.gen_tag:1.u_tag.u_sram":
        location: [1610, 16.23]
        orientation: FS
      "u_core.gen_tag:2.u_tag.u_sram":
        location: [1610, 1191.23]
        orientation: N

# Pas de signal en TopMetal1 au-dessus des SRAM : les bandes d'alimentation
# TopMetal1 y passent (courts-circuits VPWR/VGND du routage detaille, 87 violations
# au premier run complet). Obstructions posees apres la grille d'alimentation et
# retirees apres le routage detaille. Boites = SRAM (placer_sram.py).
ROUTING_OBSTRUCTIONS:
  - [TopMetal1, 10, 18.39, 794.48, 354.85]
  - [TopMetal1, 810, 18.39, 1594.48, 354.85]
  - [TopMetal1, 10, 975.71, 794.48, 1312.17]
  - [TopMetal1, 810, 975.71, 1594.48, 1312.17]
  - [TopMetal1, 1610, 16.23, 2206.48, 135.01]
  - [TopMetal1, 1610, 1191.23, 2206.48, 1310.01]

# Alimentation des SRAM : VDD! et VDDARRAY! sur VPWR, VSS! sur VGND (broches
# Metal4 de la macro).
PDN_MACRO_CONNECTIONS:
  - "u_core.* VPWR VGND VDD! VSS!"
  - "u_core.* VPWR VGND VDDARRAY! VSS!"

RUN_LVS: false
RUN_KLAYOUT_DRC: false

meta:
  version: 2
  flow: Classic
  substituting_steps:
    Odb.CheckDesignAntennaProperties: null
    Magic.SpiceExtraction: null
    Checker.IllegalOverlap: null
    Netgen.LVS: null
    Checker.LVS: null

RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true

RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_WRITE_LEF: false
RUN_MAGIC_DRC: false

RUN_KLAYOUT_STREAMOUT: true
RUN_KLAYOUT_XOR: false
