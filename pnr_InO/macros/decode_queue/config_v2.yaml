PDK: ihp-sg13cmos5l

DESIGN_NAME: ino_decode_queue

SYNTH_STRATEGY: "DELAY 1"
PL_TIMING_DRIVEN: true
# Recette du 31 octobre (etude § 8.10 a § 8.22) : synthese et placement-routage au
# coin slow, hold vu au coin fast (P40), marges de reparation (P16), antennes.
SYNTH_CORNER: nom_slow_1p08V_125C
PNR_CORNERS: [nom_slow_1p08V_125C, nom_fast_1p32V_m40C]

IO_PIN_ORDER_CFG: dir::pin_order_v2.cfg

VERILOG_FILES:
  - dir::src/ino_decode_queue.v

CLOCK_PORT: clk_i
CLOCK_PERIOD: 20

# Run de calibration (etude de vitesse, 24 octobre) : budgets d'entree / sortie tires
# du coeur entier par synth_InO/sta/sdc_macro.tcl, au lieu du SDC par defaut.
# SDC refait le 31 octobre sur la netlist v5s (P53) : pop_take_i arrive a 19,0 ns
# (21,6 avant P11 et P29) ; aucune traversee combinatoire. Run A (24 octobre, ancien
# SDC, coin typ) : -0,41 ns slow ; prevision avec le nouveau : +4,14 / +3,10 ns.
PNR_SDC_FILE: dir::ino_decode_queue_25ns.sdc
SIGNOFF_SDC_FILE: dir::ino_decode_queue_25ns.sdc

FP_SIZING: absolute
# Variante 400 x 1100 (P55, 31 octobre) : avec la recette du 31 octobre (synthese au
# coin slow, marges de reparation, hold au coin fast), le routage global dans
# 350 x 800 deborde de 7 668 (usage moyen 92 %, Metal3 101 %, Metal2 94 %). Les
# donnees vont de l'ouest (push_*) a l'est (pop_slot_o) : la capacite horizontale
# croit avec la hauteur, la demande avec la largeur. Cellules (v5s, typ) : 0,133 mm2.
# Boite 0,44 mm2 (+57 %) ; estimation : Metal3 ~75 %, Metal2 ~65 %.
DIE_AREA: [0, 0, 800, 1100]

PL_TARGET_DENSITY_PCT: 55
PL_ROUTABILITY_DRIVEN: true

# Marges des reparations (§ 8.10, P16) ; retrait de tampons interdit apres le routage
# global (lecon d'ino_fetch, P50) ; hold a 0,1 ns, vu au coin fast.
PL_RESIZER_SETUP_SLACK_MARGIN: 1.0
GRT_RESIZER_SETUP_SLACK_MARGIN: 1.0
DESIGN_REPAIR_MAX_SLEW_PCT: 25
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 25
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 30
GRT_RESIZER_SETUP_BUFFER_REMOVAL: false
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.1

GRT_ALLOW_CONGESTION: true
GRT_ANTENNA_REPAIR_ITERS: 6
GRT_ANTENNA_REPAIR_MARGIN: 20
DIODE_ON_PORTS: in
DIODE_CELL: sg13cmos5l_antennanp/A

# Parasites estimes (26 octobre) : la configuration LibreLane de sg13cmos5l laisse
# LAYERS_RC vide ; l'estimation (repair_design, reparations apres routage global,
# timing des etapes de placement-routage) prend alors les valeurs du LEF technologique,
# environ 0,09 fF/um et 0,5 ohm/um en Metal2, quand l'extraction finale (OpenRCX,
# IHP_rcx_patterns.rules) en donne environ le double en capacite. Les reparations
# voient des fils deux fois trop legers : en signoff, des portes de force 1 chargent
# 0,28 pF (slews de 4 a 5 ns ; run E : 244 violations de slew, 4 vues par la
# reparation). Valeurs de la configuration de sg13g2 (ajustement d'OpenROAD-flow-
# scripts), meme pile de metaux de Metal1 a Metal4 ; TopMetal1 et vias : LEF.
LAYERS_RC:
  "*":
    Metal1: { res: 8.54576E-03, cap: 1.0E-10 }
    Metal2: { res: 2.53519E-03, cap: 1.69121E-04 }
    Metal3: { res: 1.54329E-03, cap: 1.82832E-04 }
    Metal4: { res: 6.31424E-04, cap: 1.66454E-04 }

RUN_LVS: false               # extraction SPICE (Magic) et LVS (Netgen)

meta:
  version: 2
  flow: Classic
  substituting_steps:
    Odb.CheckDesignAntennaProperties: null   # retire l'étape (pas de LEF sans Magic)
    Magic.SpiceExtraction: null
    Checker.IllegalOverlap: null
    Netgen.LVS: null
    Checker.LVS: null

RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true

RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_WRITE_LEF: false
RUN_MAGIC_DRC: false

RUN_KLAYOUT_STREAMOUT: true
RUN_KLAYOUT_DRC: false
RUN_KLAYOUT_XOR: false
